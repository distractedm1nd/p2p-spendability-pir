[package]
name = "spendability-pir-zakura"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []
ypir = [
    "dep:zakura-network",
    "dep:spend-server",
    "dep:witness-server",
    "dep:pir-types",
    "dep:thiserror",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
# The custom service API currently lives in the sibling Zakura checkout.
zakura-network = { path = "../../zakura/crates/zakura-network", optional = true }
spend-server = { path = "../nullifier/spend-server", default-features = false, features = ["ypir"], optional = true }
witness-server = { path = "../witness/witness-server", default-features = false, features = ["ypir"], optional = true }
pir-types = { path = "../shared/pir-types", optional = true }

thiserror = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
