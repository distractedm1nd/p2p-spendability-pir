[package]
name = "spendability-pir-zakura"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
zakura-network = { git = "https://github.com/distractedm1nd/zakura", branch = "custom-services" }
spend-server = { path = "../nullifier/spend-server" }
witness-server = { path = "../witness/witness-server" }
pir-types = { path = "../shared/pir-types" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
