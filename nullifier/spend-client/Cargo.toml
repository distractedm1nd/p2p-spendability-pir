[package]
name = "spend-client"
version = "0.1.0"
edition = "2021"

[features]
live = []

[dependencies]
spend-types = { path = "../spend-types" }
ypir = { package = "valar-ypir", version = "=0.1.4", default-features = false }
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
spend-server = { path = "../spend-server" }
hashtable-pir = { path = "../hashtable-pir" }
nf-ingest = { path = "../nf-ingest" }
axum = "0.7"
tonic = "0.12"
tokio-stream = "0.1"
tempfile = "3"
