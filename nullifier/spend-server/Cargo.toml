[package]
name = "spend-server"
version = "0.1.0"
edition = "2021"

[dependencies]
spend-types = { path = "../spend-types" }
hashtable-pir = { path = "../hashtable-pir" }
nf-ingest = { path = "../nf-ingest" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ypir = { package = "valar-ypir", version = "=0.1.4", default-features = false, features = ["server", "rayon"] }
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
tonic = "0.12"
tokio-stream = "0.1"
