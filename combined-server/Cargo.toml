[package]
name = "combined-server"
version = "0.1.0"
edition = "2021"
default-run = "spend-server"

[[bin]]
name = "spend-server"
path = "src/main.rs"

[dependencies]
spend-server = { path = "../nullifier/spend-server" }
witness-server = { path = "../witness/witness-server" }
spend-types = { path = "../nullifier/spend-types" }
witness-types = { path = "../witness/witness-types" }
pir-types = { path = "../shared/pir-types" }
commitment-ingest = { path = "../witness/commitment-ingest" }
hashtable-pir = { path = "../nullifier/hashtable-pir" }
commitment-tree-db = { path = "../witness/commitment-tree-db" }
spendability-pir-zakura = { path = "../zakura-server" }
zakura = { git = "https://github.com/distractedm1nd/zakura", branch = "custom-services", default-features = false }
zakura-network = { git = "https://github.com/distractedm1nd/zakura", branch = "custom-services" }
chain-ingest = { path = "../shared/chain-ingest" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
ypir = { package = "valar-ypir", version = "=0.1.4", default-features = false }
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }
