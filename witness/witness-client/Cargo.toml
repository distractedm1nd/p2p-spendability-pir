[package]
name = "witness-client"
version = "0.1.0"
edition = "2021"

[features]
default = []
ypir = []
ipir = ["dep:ipir-sp", "dep:inspiring"]

[dependencies]
witness-types = { path = "../witness-types" }
pir-types = { path = "../../shared/pir-types" }
orchard = { version = "0.14", default-features = false }
incrementalmerkletree = "0.8"
ypir = { package = "valar-ypir", git = "https://github.com/valargroup/ypir.git", branch = "valar/artifact", default-features = false }
spiral-rs = { package = "valar-spiral-rs", git = "https://github.com/valargroup/spiral-rs.git", branch = "valar/avoid-avx512" }
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "aff18bda01125b81e3c7d197371f59b0f02f9c4e", optional = true }
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "aff18bda01125b81e3c7d197371f59b0f02f9c4e", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
commitment-tree-db = { path = "../commitment-tree-db" }
commitment-ingest = { path = "../commitment-ingest" }
chain-ingest = { path = "../../shared/chain-ingest" }
witness-server = { path = "../witness-server" }
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
