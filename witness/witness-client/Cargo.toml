[package]
name = "witness-client"
version = "0.1.0"
edition = "2021"

[dependencies]
witness-types = { path = "../witness-types" }
pir-types = { path = "../../shared/pir-types" }
orchard = { version = "0.15", default-features = false }
incrementalmerkletree = "0.8"
ypir = { package = "valar-ypir", version = "=0.1.4", default-features = false }
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
commitment-tree-db = { path = "../commitment-tree-db" }
commitment-ingest = { path = "../commitment-ingest" }
chain-ingest = { path = "../../shared/chain-ingest" }
witness-server = { path = "../witness-server" }
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
