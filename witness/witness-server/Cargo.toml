[package]
name = "witness-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "witness-server"
path = "src/main.rs"

[dependencies]
witness-types = { path = "../witness-types" }
commitment-tree-db = { path = "../commitment-tree-db" }
commitment-ingest = { path = "../commitment-ingest" }
chain-ingest = { path = "../../shared/chain-ingest" }
pir-types = { path = "../../shared/pir-types" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ypir = { package = "valar-ypir", version = "=0.1.4", default-features = false, features = ["server"] }
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }

[dev-dependencies]
witness-client = { path = "../witness-client" }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
