[package]
name = "spendability-pir-client"
version = "0.1.0"
edition = "2021"

[features]
live = []

[dependencies]
pir-protocol = { path = "../protocol" }
nullifier-pir = { path = "../nullifier" }
witness-pir = { path = "../witness" }
ypir = { package = "valar-ypir", version = "=0.1.4", default-features = false }
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }
orchard = { version = "0.15", default-features = false }
incrementalmerkletree = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
